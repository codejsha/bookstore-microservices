apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: trivy-fs-scan
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.27.2"
    tekton.dev/categories: Security
    tekton.dev/tags: scan,vulnerability,secret,sca
    tekton.dev/displayName: "Trivy filesystem scan"
spec:
  description: >-
    Runs `trivy fs` against the source workspace to detect dependency
    vulnerabilities and committed secrets. Findings at or above SEVERITY are
    reported; EXIT_CODE decides whether they also fail the pipeline.
  results:
    - name: found
      description: >-
        "true" if findings at or above SEVERITY were reported, "false" if the
        scan came back clean. Written even in warn-only mode (EXIT_CODE "0"),
        so a finally task can surface the outcome as its own commit status.
  workspaces:
    - name: source
    - name: dockerconfig
      description: >-
        Registry credentials. This task pulls no image, but it does pull the
        vulnerability DB from an OCI registry, and DB_REPOSITORY points that at
        the authenticated in-cluster cache.
      optional: true
  params:
    - name: CONTEXT_DIR
      description: directory under workspace to scan
      type: string
      default: ./
    - name: SEVERITY
      description: comma-separated severities that fail the build
      type: string
      default: CRITICAL
    - name: SKIP_DIRS
      description: >-
        Comma-separated directories to exclude. CI clones build-time dependencies
        into the workspace (e.g. the shared Go library); their own go.mod pins are
        not what the binary resolves to, so scanning them reports vulnerabilities
        that are not in the artifact.
      type: string
      default: ""
    - name: EXIT_CODE
      description: >-
        Exit code trivy returns when it finds something at or above SEVERITY.
        "1" fails the pipeline; "0" reports the findings and lets it continue,
        which is how you run the scanner in warn-only mode.
      type: string
      default: "1"
    - name: TRIVY_IMAGE
      description: Trivy CLI image
      type: string
      default: docker.io/aquasec/trivy:0.52.2
    - name: DB_REPOSITORY
      description: >-
        OCI repository the vulnerability DB is pulled from. Trivy re-downloads
        it on every run, so pointing this at the in-cluster pull-through cache
        keeps CI off ghcr.io. Empty falls back to trivy's ghcr.io default.
      type: string
      default: ""
    - name: JAVA_DB_REPOSITORY
      description: >-
        OCI repository the Java DB is pulled from — only fetched when the scan
        finds jars. Empty falls back to trivy's ghcr.io default.
      type: string
      default: ""
    - name: INSECURE
      description: >-
        Allow a plain-HTTP / untrusted-TLS registry for the DB pull. The
        in-cluster cache is addressed over HTTP.
      type: string
      default: "false"
  steps:
    - name: scan
      image: $(params.TRIVY_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.CONTEXT_DIR)
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        SKIP_ARGS=""
        if [ -n "$(params.SKIP_DIRS)" ]; then
          SKIP_ARGS="--skip-dirs $(params.SKIP_DIRS)"
        fi
        if [ -n "$(params.DB_REPOSITORY)" ]; then
          export TRIVY_DB_REPOSITORY="$(params.DB_REPOSITORY)"
        fi
        if [ -n "$(params.JAVA_DB_REPOSITORY)" ]; then
          export TRIVY_JAVA_DB_REPOSITORY="$(params.JAVA_DB_REPOSITORY)"
        fi
        if [ "$(params.INSECURE)" = "true" ]; then
          export TRIVY_INSECURE=true
        fi
        rc=0
        # shellcheck disable=SC2086
        trivy fs \
          $SKIP_ARGS \
          --scanners vuln,secret \
          --severity "$(params.SEVERITY)" \
          --exit-code 5 \
          --no-progress \
          --ignore-unfixed \
          . || rc=$?
        if [ "$rc" -eq 5 ]; then
          printf 'true' > "$(results.found.path)"
          [ "$(params.EXIT_CODE)" = "0" ] || exit "$(params.EXIT_CODE)"
        elif [ "$rc" -eq 0 ]; then
          printf 'false' > "$(results.found.path)"
        else
          exit "$rc"
        fi
