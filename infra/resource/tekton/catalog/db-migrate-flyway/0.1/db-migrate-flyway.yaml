apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: db-migrate-flyway
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.27.2"
    tekton.dev/categories: Database
    tekton.dev/tags: migrate
    tekton.dev/displayName: "DB Migrate (Flyway)"
spec:
  description: >-
    Runs Flyway against PostgreSQL. Credentials come from DB_SECRET_NAME, the
    CloudNativePG application secret (username/password), read optionally. A
    service that owns no database (a BFF, for instance) ships no migrations
    directory; the task detects that and exits cleanly, so the pipeline's later
    deploy steps still run. Guarding this with a `when` expression instead would
    skip every task that depends on it -- which here is the whole deploy chain.
  workspaces:
    - name: source
  params:
    - name: MIGRATIONS_DIR
      description: migrations directory relative to workspace
      type: string
      default: db/migrations
    - name: DB_SECRET_NAME
      description: >-
        K8s secret holding the PostgreSQL credentials (CloudNativePG
        username/password). Read optionally: a service with no database has no
        such secret, and a missing secretKeyRef would fail the pod before the
        skip check below can run.
      type: string
    - name: DB_HOST
      description: PostgreSQL host
      type: string
    - name: DB_NAME
      description: database name
      type: string
  steps:
    - name: migrate-up
      image: docker.io/flyway/flyway:10-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: username
              optional: true
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.DB_SECRET_NAME)
              key: password
              optional: true
      command: ["/bin/sh", "-e", "-c"]
      args:
        - |
          if [ ! -d "$(params.MIGRATIONS_DIR)" ]; then
            echo "no $(params.MIGRATIONS_DIR) in this service - nothing to migrate"
            exit 0
          fi

          if [ -z "${POSTGRES_USER:-}" ]; then
            echo "secret $(params.DB_SECRET_NAME) carries no username/password" >&2
            exit 1
          fi

          FLYWAY_USER="$POSTGRES_USER" FLYWAY_PASSWORD="${POSTGRES_PASSWORD:-}" flyway \
            -url="jdbc:postgresql://$(params.DB_HOST):5432/$(params.DB_NAME)?sslmode=disable" \
            -connectRetries=3 \
            -connectRetriesInterval=10 \
            -locations="filesystem:$(params.MIGRATIONS_DIR)" \
            -baselineOnMigrate=true \
            migrate
