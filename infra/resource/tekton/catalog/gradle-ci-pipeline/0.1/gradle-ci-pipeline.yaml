apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: gradle-ci-pipeline
spec:
  description: |
    CI half of the gradle flow — everything up to a scanned image in the
    registry. Triggered only through the Gitea Actions tekton-pipeline
    workflow (rendered by the gradle-triggertemplate); monitor runs with tkn.
    Deployment is a separate cd-pipeline run, never created by this pipeline.
    tasks:
      - clone-source-repo (git-clone)
      - clone-plugin-repo (git-clone, jooq-codegen-plugin)
      - clone-lib-repo (git-clone, shared-library-kotlin)
      - trivy-fs-scan (trivy fs vuln)
      - gitleaks-scan (gitleaks secret detection, commits since last scanned build)
      - build-app (gradle)
      - build-image (kaniko)
      - trivy-image-scan (trivy image)

  workspaces:
    - name: shared-workspace
    - name: dockerconfig
    - name: git-source-ssh-auth
    - name: git-plugin-ssh-auth
    - name: git-lib-ssh-auth

  params:
    ### run identity params
    - name: service-name
      type: string
    - name: git-source-revision
      type: string
    ### registry params
    - name: harbor-registry
      type: string
      default: harbor.example.com
    ### git (sibling Kotlin repos) params
    - name: git-plugin-repo-url
      type: string
      default: ssh://git@gitea-ssh.gitea.svc.cluster.local:22/example-corp/jooq-codegen-plugin.git
    - name: git-plugin-revision
      type: string
      default: main
    - name: git-plugin-subdir
      type: string
      default: .lib/jooq-codegen-plugin
    - name: git-lib-repo-url
      type: string
      default: ssh://git@gitea-ssh.gitea.svc.cluster.local:22/example-corp/shared-library-kotlin.git
    - name: git-lib-revision
      type: string
      default: main
    - name: git-lib-subdir
      type: string
      default: .lib/shared-library-kotlin
    ### gradle (app build) params
    - name: gradle-image
      type: string
      default: docker.io/library/gradle:9.4.1-jdk25
    - name: context-dir
      type: string
      default: .
    - name: tasks
      type: array
      default:
        - clean
        - build
    - name: nexus-maven-url
      type: string
      default: http://nexus.nexus.svc.cluster.local:8081/repository/maven-group/
    - name: nexus-secret-name
      type: string
      default: nexus-credentials
    - name: foojay-version
      type: string
      default: "1.0.0"
    ### codegen-verify params
    - name: oapi-codegen-image
      type: string
      default: harbor.example.com/bookstore/oapi-codegen-cli:1.0.0
    - name: nexus-raw-url
      type: string
      default: http://nexus.nexus.svc.cluster.local:8081/repository/raw-hosted
    - name: skip-codegen-verify
      type: string
      default: "true"
    ### kaniko (image build) params
    - name: kaniko-dockerfile
      type: string
      default: ./ci/Dockerfile
    - name: kaniko-context
      type: string
      default: ./
    - name: kaniko-builder-image
      type: string
      default: gcr.io/kaniko-project/executor:latest
    ### security params
    - name: trivy-fs-context-dir
      type: string
      default: ./
    - name: trivy-severity
      type: string
      default: CRITICAL
    - name: trivy-exit-code
      type: string
      default: "0"
    - name: trivy-image-insecure
      type: string
      default: "true"
    - name: trivy-db-repository
      type: string
      default: nexus-docker.nexus.svc.cluster.local:5000/aquasecurity/trivy-db:2
    - name: trivy-java-db-repository
      type: string
      default: nexus-docker.nexus.svc.cluster.local:5000/aquasecurity/trivy-java-db:1
    - name: gitleaks-exit-code
      type: string
      default: "0"
    - name: gitleaks-exclude-paths
      type: string
      default: '(^|/)\.lib/'
    - name: gitleaks-image
      type: string
      default: docker.io/zricethezav/gitleaks:v8.21.2

  tasks:
    ### task
    - name: acquire-run-slot
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/acquire-run-slot/0.1/acquire-run-slot.yaml
      params:
        - name: service-name
          value: $(params.service-name)
        - name: own-run
          value: $(context.pipelineRun.name)

    - name: clone-source-repo
      runAfter:
        - acquire-run-slot
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/0.9/git-clone.yaml
      params:
        - name: url
          value: ssh://git@gitea-ssh.gitea.svc.cluster.local:22/example-corp/$(params.service-name)-source.git
        - name: revision
          value: $(params.git-source-revision)
        - name: subdirectory
          value: ./
        - name: depth
          value: "0"
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-directory
          workspace: git-source-ssh-auth

    ### task
    - name: clone-plugin-repo
      runAfter:
        - clone-source-repo
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/0.9/git-clone.yaml
      params:
        - name: url
          value: $(params.git-plugin-repo-url)
        - name: revision
          value: $(params.git-plugin-revision)
        - name: subdirectory
          value: $(params.git-plugin-subdir)
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-directory
          workspace: git-plugin-ssh-auth

    ### task
    - name: clone-lib-repo
      runAfter:
        - clone-plugin-repo
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/git-clone/0.9/git-clone.yaml
      params:
        - name: url
          value: $(params.git-lib-repo-url)
        - name: revision
          value: $(params.git-lib-revision)
        - name: subdirectory
          value: $(params.git-lib-subdir)
      workspaces:
        - name: output
          workspace: shared-workspace
        - name: ssh-directory
          workspace: git-lib-ssh-auth

    ### task
    - name: codegen-verify
      runAfter:
        - clone-lib-repo
      when:
        - input: $(params.skip-codegen-verify)
          operator: notin
          values:
            - "true"
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/codegen-verify/0.1/codegen-verify.yaml
      params:
        - name: OAPI_CODEGEN_IMAGE
          value: $(params.oapi-codegen-image)
        - name: CONTEXT_DIR
          value: $(params.context-dir)
        - name: TARGET_DIR
          value: $(params.context-dir)
        - name: NEXUS_RAW_URL
          value: $(params.nexus-raw-url)
        - name: NEXUS_SECRET_NAME
          value: $(params.nexus-secret-name)
        - name: SKIP
          value: $(params.skip-codegen-verify)
      workspaces:
        - name: source
          workspace: shared-workspace

    ### task
    - name: trivy-fs-scan
      runAfter:
        - clone-lib-repo
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/trivy-fs-scan/0.1/trivy-fs-scan.yaml
      params:
        - name: CONTEXT_DIR
          value: $(params.trivy-fs-context-dir)
        - name: SEVERITY
          value: $(params.trivy-severity)
        - name: EXIT_CODE
          value: $(params.trivy-exit-code)
        - name: INSECURE
          value: $(params.trivy-image-insecure)
        - name: DB_REPOSITORY
          value: $(params.trivy-db-repository)
        - name: JAVA_DB_REPOSITORY
          value: $(params.trivy-java-db-repository)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    ### task
    - name: gitleaks-scan
      runAfter:
        - clone-lib-repo
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/gitleaks-scan/0.1/gitleaks-scan.yaml
      params:
        - name: SCAN_MODE
          value: git
        - name: BASELINE_STATUSES_URL
          value: http://gitea-http.gitea.svc.cluster.local:3000/api/v1/repos/example-corp/$(params.service-name)-source/statuses
        - name: EXCLUDE_PATHS
          value: $(params.gitleaks-exclude-paths)
        - name: EXIT_CODE
          value: $(params.gitleaks-exit-code)
        - name: GITLEAKS_IMAGE
          value: $(params.gitleaks-image)
      workspaces:
        - name: source
          workspace: shared-workspace

    ### task
    - name: build-app
      runAfter:
        - trivy-fs-scan
      taskSpec:
        workspaces:
          - name: source
        params:
          - name: gradle-image
            type: string
          - name: context-dir
            type: string
          - name: tasks
            type: array
          - name: plugin-dir
            type: string
          - name: lib-dir
            type: string
          - name: nexus-maven-url
            type: string
          - name: nexus-secret-name
            type: string
          - name: foojay-version
            type: string
        steps:
          - name: gradle-build
            image: $(params.gradle-image)
            workingDir: $(workspaces.source.path)/$(params.context-dir)
            env:
              - name: PLUGIN_DIR
                value: $(params.plugin-dir)
              - name: LIB_DIR
                value: $(params.lib-dir)
              - name: FOOJAY_VERSION
                value: $(params.foojay-version)
              - name: NEXUS_MAVEN_URL
                value: $(params.nexus-maven-url)
              - name: NEXUS_USER
                valueFrom:
                  secretKeyRef:
                    name: $(params.nexus-secret-name)
                    key: username
              - name: NEXUS_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: $(params.nexus-secret-name)
                    key: password
              - name: GRADLE_USER_HOME
                value: $(workspaces.source.path)/.gradle
            args: ["$(params.tasks[*])"]
            script: |
              #!/usr/bin/env sh
              set -eu

              mkdir -p "$GRADLE_USER_HOME/init.d"
              cat > "$GRADLE_USER_HOME/init.d/nexus.gradle" <<'INIT'
              def nexusUrl = System.getenv('NEXUS_MAVEN_URL')
              def nexusUser = System.getenv('NEXUS_USER')
              def nexusPassword = System.getenv('NEXUS_PASSWORD')
              def pluginDir = System.getenv('PLUGIN_DIR')
              def libDir = System.getenv('LIB_DIR')
              def foojayVersion = System.getenv('FOOJAY_VERSION')

              def applyNexus = { handler ->
                  handler.clear()
                  handler.maven { repo ->
                      repo.url = nexusUrl
                      repo.allowInsecureProtocol = true
                      repo.credentials { c ->
                          c.username = nexusUser
                          c.password = nexusPassword
                      }
                  }
              }

              beforeSettings { settings ->
                  applyNexus(settings.pluginManagement.repositories)
                  settings.dependencyResolutionManagement {
                      applyNexus(it.repositories)
                  }

                  settings.pluginManagement.resolutionStrategy.eachPlugin { details ->
                      if (details.requested.id.id == 'org.gradle.toolchains.foojay-resolver-convention') {
                          details.useVersion(foojayVersion)
                      }
                  }

                  def plugin = new File(settings.rootDir, pluginDir)
                  def lib = new File(settings.rootDir, libDir)
                  if (plugin.isDirectory() && lib.isDirectory()) {
                      settings.pluginManagement.includeBuild(plugin.absolutePath)
                      settings.includeBuild(lib.absolutePath)
                  }
              }

              allprojects {
                  buildscript { applyNexus(repositories) }
                  afterEvaluate { applyNexus(repositories) }
              }
              INIT

              gradle --no-daemon "$@"

              chmod -R a+rwX "$(workspaces.source.path)" 2>/dev/null || true
      params:
        - name: gradle-image
          value: $(params.gradle-image)
        - name: context-dir
          value: $(params.context-dir)
        - name: tasks
          value:
            - $(params.tasks[*])
        - name: plugin-dir
          value: $(params.git-plugin-subdir)
        - name: lib-dir
          value: $(params.git-lib-subdir)
        - name: nexus-maven-url
          value: $(params.nexus-maven-url)
        - name: nexus-secret-name
          value: $(params.nexus-secret-name)
        - name: foojay-version
          value: $(params.foojay-version)
      workspaces:
        - name: source
          workspace: shared-workspace

    ### task
    - name: build-image
      runAfter:
        - build-app
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tekton-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/kaniko/0.6/kaniko.yaml
      params:
        - name: IMAGE
          value: $(params.harbor-registry)/bookstore/$(params.service-name):1.0.0-$(params.git-source-revision)
        - name: DOCKERFILE
          value: $(params.kaniko-dockerfile)
        - name: CONTEXT
          value: $(params.kaniko-context)
        - name: EXTRA_ARGS
          value:
            - --build-arg=SERVICE_NAME=$(params.service-name)
            - --build-arg=IMAGE_VERSION=1.0.0-$(params.git-source-revision)
            - --build-arg=IMAGE_REVISION=$(params.git-source-revision)
            - --verbosity=info
        - name: BUILDER_IMAGE
          value: $(params.kaniko-builder-image)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    ### task
    - name: trivy-image-scan
      runAfter:
        - build-image
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/trivy-image-scan/0.1/trivy-image-scan.yaml
      params:
        - name: IMAGE
          value: $(params.harbor-registry)/bookstore/$(params.service-name):1.0.0-$(params.git-source-revision)
        - name: SEVERITY
          value: $(params.trivy-severity)
        - name: EXIT_CODE
          value: $(params.trivy-exit-code)
        - name: INSECURE
          value: $(params.trivy-image-insecure)
        - name: DB_REPOSITORY
          value: $(params.trivy-db-repository)
        - name: JAVA_DB_REPOSITORY
          value: $(params.trivy-java-db-repository)
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig

  finally:
    - name: report-commit-status
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/gitea-commit-status/0.1/gitea-commit-status.yaml
      params:
        - name: service-name
          value: $(params.service-name)
        - name: git-source-revision
          value: $(params.git-source-revision)
        - name: status-context
          value: tekton/ci
        - name: pipeline-status
          value: $(tasks.status)
    - name: report-trivy-fs-status
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/gitea-scan-status/0.1/gitea-scan-status.yaml
      params:
        - name: service-name
          value: $(params.service-name)
        - name: git-source-revision
          value: $(params.git-source-revision)
        - name: status-context
          value: tekton/ci/trivy-fs
        - name: found
          value: $(tasks.trivy-fs-scan.results.found)
        - name: description
          value: trivy fs $(params.trivy-severity)
    - name: report-gitleaks-status
      retries: 2
      taskRef:
        resolver: git
        params:
          - name: repo
            value: tektoncd-custom-catalog
          - name: revision
            value: main
          - name: pathInRepo
            value: task/gitea-scan-status/0.1/gitea-scan-status.yaml
      params:
        - name: service-name
          value: $(params.service-name)
        - name: git-source-revision
          value: $(params.git-source-revision)
        - name: status-context
          value: tekton/ci/gitleaks
        - name: found
          value: $(tasks.gitleaks-scan.results.found)
        - name: description
          value: gitleaks
