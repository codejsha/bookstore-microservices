apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: bookstore-gradle
spec:
  serviceAccountName: git-source-sa
  triggers:
    - name: manual-ci-trigger
      interceptors:
        - ref:
            name: "github"
          params:
            - name: "secretRef"
              value:
                secretName: gitea-webhook-secret
                secretKey: secretToken
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: "header.match('X-Bookstore-Event', 'ci')"
            - name: "overlays"
              value:
                - key: "service.name"
                  expression: "body.repository.name.split('-source')[0]"
                - key: "repo.url"
                  expression: "body.repository.ssh_url"
                - key: "repo.name"
                  expression: "body.repository.name"
                - key: "ref"
                  expression: "body.ref"
                - key: "after"
                  expression: "body.after"
      bindings:
        - ref: git-triggerbinding
      template:
        ref: gradle-triggertemplate
    - name: manual-cd-trigger
      interceptors:
        - ref:
            name: "github"
          params:
            - name: "secretRef"
              value:
                secretName: gitea-webhook-secret
                secretKey: secretToken
        - ref:
            name: "cel"
          params:
            - name: "filter"
              value: "header.match('X-Bookstore-Event', 'cd')"
            - name: "overlays"
              value:
                - key: "service.name"
                  expression: "body.repository.name.split('-source')[0]"
                - key: "repo.url"
                  expression: "body.repository.ssh_url"
                - key: "repo.name"
                  expression: "body.repository.name"
                - key: "ref"
                  expression: "body.ref"
                - key: "after"
                  expression: "body.after"
      bindings:
        - ref: git-triggerbinding
      template:
        ref: gradle-cd-triggertemplate
  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: 10m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 512Mi
