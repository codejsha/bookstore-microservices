apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: gradle-triggertemplate
  namespace: "${namespace}"
spec:
  params:
    - name: service-name
    - name: git-repo-url
    - name: git-repo-name
    - name: git-ref
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: pipelinerun-gradle-ci-
        labels:
          bookstore.dev/service: $(tt.params.service-name)
      spec:
        pipelineRef:
          resolver: git
          params:
            - name: repo
              value: tektoncd-custom-catalog
            - name: revision
              value: main
            - name: pathInRepo
              value: task/gradle-ci-pipeline/0.1/gradle-ci-pipeline.yaml
        taskRunTemplate:
          podTemplate:
            imagePullSecrets:
              - name: harbor-pull
        taskRunSpecs:
          - pipelineTaskName: clone-source-repo
            serviceAccountName: git-source-sa
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
          - name: dockerconfig
            secret:
              secretName: dockerconfig-secret
          - name: git-source-ssh-auth
            secret:
              secretName: $(tt.params.service-name)-repo-ssh-auth
          - name: git-plugin-ssh-auth
            secret:
              secretName: jooq-codegen-plugin-repo-ssh-auth
          - name: git-lib-ssh-auth
            secret:
              secretName: shared-library-kotlin-repo-ssh-auth
        params:
          - name: service-name
            value: $(tt.params.service-name)
          - name: git-source-revision
            value: $(tt.params.git-revision)
          - name: skip-codegen-verify
            value: "${skip_codegen_verify}"
