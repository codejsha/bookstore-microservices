{{- if .Values.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "config-server.fullname" . }}-route
  labels:
    {{- include "config-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayApi.gatewayName }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      sectionName: https-{{ splitList "." .Values.gatewayApi.host | first }}
  hostnames:
    - {{ .Values.gatewayApi.host }}
  rules:
    - backendRefs:
        - name: {{ include "config-server.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
