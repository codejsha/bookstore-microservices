replicaCount: 1
image:
  repository: harbor.example.com/bookstore/config-server
  tag: ""
  pullPolicy: Always
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true
  annotations: {}
podLabels:
  app.kubernetes.io/group: config-server
podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/role: "config-server-gitea-role"
  vault.hashicorp.com/agent-inject-secret-git.properties: "kv/data/gitea/admin/credentials"
  vault.hashicorp.com/agent-inject-template-git.properties: |
    {{- with secret "kv/data/gitea/admin/credentials" -}}
    gitea.username={{ .Data.data.username }}
    gitea.password={{ .Data.data.password }}
    {{- end -}}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8888
  https:
    enabled: false
    port: 8443
gatewayApi:
  enabled: false
  host: "example.com"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
resources: {}
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
