deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: ${s3_bucket}
      ruler: ${s3_bucket}
      admin: ${s3_bucket}
    s3:
      endpoint: ${s3_endpoint}
      region: ${s3_region}
      s3ForcePathStyle: true
      insecure: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.container.name
              - deployment.environment.name

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    size: 20Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

gateway:
  enabled: true
  replicas: 1
  deploymentStrategy:
    type: Recreate
    rollingUpdate: null
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
    relabelings:
      - sourceLabels: [__meta_kubernetes_service_name]
        regex: loki-gateway
        action: drop
