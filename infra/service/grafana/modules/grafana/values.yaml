service:
  type: ClusterIP
  port: 80

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin_user
  passwordKey: admin_password

persistence:
  enabled: true
  type: sts
  accessModes:
    - ReadWriteOnce
  size: 20Gi

serviceMonitor:
  enabled: true
  labels:
    release: prometheus

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "bookstore"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: true
    label: grafana_datasource
    labelValue: "1"
    searchNamespace: ALL

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.grafana.svc.cluster.local
        access: proxy
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=(\\w+)"
              url: "$${__value.raw}"
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.grafana.svc.cluster.local:3100
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
            filterBySpanID: false
            tags:
              - key: service.name
                value: service_name
          tracesToMetrics:
            datasourceUid: prometheus
          tracesToProfiles:
            datasourceUid: pyroscope
            tags:
              - key: service.name
                value: service_name
            profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki

      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://pyroscope.grafana.svc.cluster.local:4040
        access: proxy

plugins: []

extraSecretMounts:
  - name: grafana-oidc
    secretName: grafana-oidc
    defaultMode: 0440
    mountPath: /etc/secrets/grafana-oidc
    readOnly: true
    optional: true

extraConfigmapMounts:
  - name: grafana-keycloak-ca
    configMap: grafana-keycloak-ca
    mountPath: /etc/grafana/keycloak-ca
    readOnly: true
    optional: true

grafana.ini:
  server:
    domain: grafana.example.com
    root_url: "https://%(domain)s/"
  analytics:
    reporting_enabled: false
    check_for_updates: false
  auth:
    disable_login_form: true
    signout_redirect_url: "https://keycloak.example.com/realms/platform-infra/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.example.com%2Flogin"
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    auto_login: true
    client_id: grafana
    client_secret: $__file{/etc/secrets/grafana-oidc/client_secret}
    scopes: openid profile email
    auth_url: https://keycloak.example.com/realms/platform-infra/protocol/openid-connect/auth
    token_url: https://keycloak.example.com/realms/platform-infra/protocol/openid-connect/token
    api_url: https://keycloak.example.com/realms/platform-infra/protocol/openid-connect/userinfo
    tls_client_ca: /etc/grafana/keycloak-ca/ca.crt
    use_pkce: true
    use_refresh_token: true
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    role_attribute_path: "contains(roles[*], 'ADMIN') && 'GrafanaAdmin' || contains(roles[*], 'OPERATOR') && 'Editor' || contains(roles[*], 'DEVELOPER') && 'Viewer'"
    role_attribute_strict: true
    allow_assign_grafana_admin: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
