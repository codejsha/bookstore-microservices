alloy:
  configMap:
    create: true
    content: |
      ${indent(6, config_contents)}

  clustering:
    enabled: true

  extraPorts:
    - name: faro-http
      port: 12347
      targetPort: 12347
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

controller:
  type: deployment
  replicas: 1

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus
