replicaCount: 1

image:
  rootless: false

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: NodePort
    port: 22
    nodePort: 30022

resources:
  limits:
    cpu: 500m
    memory: 2048Mi
  requests:
    cpu: 10m
    memory: 128Mi

serviceAccount:
  create: false
  name: "gitea"

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

initPreScript: |
  mkdir -p /data/ssh
  install -o root -g root -m 600 /etc/gitea/ssh/gitea.rsa /data/ssh/ssh_host_rsa_key
  if [ -f "${GITEA_APP_INI}" ] && [ ! -s /data/git/.ssh/authorized_keys ]; then
    su-exec 1000:1000 env HOME=/data/git USER=git gitea --config "${GITEA_APP_INI}" admin regenerate keys
  fi

initContainers:
  resources:
    limits: {}
    requests:
      cpu: 10m
      memory: 128Mi

deployment:
  env:
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/gitea/keycloak-ca

gitea:
  oauth:
    - name: Keycloak
      provider: openidConnect
      existingSecret: gitea-oidc
      autoDiscoverUrl: https://keycloak.example.com/realms/platform-infra/.well-known/openid-configuration
      scopes: "openid profile email groups"
      groupClaimName: groups
      adminGroup: ADMIN
      groupTeamMap: '{"MANAGER":{"example-corp":["devops-team"]},"DEVELOPER":{"example-corp":["dev-team"]}}'

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

  admin:
    passwordMode: keepUpdated

  config:
    database:
      DB_TYPE: postgres
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
    server:
      ROOT_URL: https://git.example.com/
      START_SSH_SERVER: false
      SSH_PORT: 22
      SSH_LISTEN_PORT: 2222
    webhook:
      ALLOWED_HOST_LIST: "*.svc.cluster.local"
    service:
      DISABLE_REGISTRATION: false
      ALLOW_ONLY_EXTERNAL_REGISTRATION: true
      ENABLE_PASSWORD_SIGNIN_FORM: false
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
      USERNAME: preferred_username
      ACCOUNT_LINKING: auto
      UPDATE_AVATAR: false
    actions:
      ENABLED: true

  podAnnotations:
    traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"

valkey-cluster:
  enabled: false
  usePassword: false
  usePasswordFiles: false

  cluster:
    nodes: 1
    replicas: 3

  service:
    ports:
      valkey: 6379

valkey:
  enabled: true
  architecture: standalone

  master:
    count: 1
    service:
      ports:
        valkey: 6379

  networkPolicy:
    enabled: false

postgresql-ha:
  enabled: false
  global:
    postgresql:
      database: gitea_db

  service:
    ports:
      postgresql: 5432

  persistence:
    size: 10Gi

postgresql:
  enabled: true

  global:
    postgresql:
      auth:
        database: gitea_db
      service:
        ports:
          postgresql: 5432

  primary:
    networkPolicy:
      enabled: false
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  readReplicas:
    networkPolicy:
      enabled: false

checkDeprecation: false
test:
  enabled: false
  image:
    name: busybox
    tag: latest
