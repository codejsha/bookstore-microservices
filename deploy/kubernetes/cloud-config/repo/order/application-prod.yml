spring:
  config:
    import: "optional:file:/vault/secrets/db.properties"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://order-mysql.bookstore.svc.cluster.local:3306/order_db?allowPublicKeyRetrieval=true&characterEncoding=utf8&useSSL=false
    username: ${db.username}
    password: ${db.password}
    hikari:
      minimum-idle: 30
      maximum-pool-size: 30
      connection-timeout: 10000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      auto-commit: true
      max-lifetime: 1800000
  data:
    redis:
      host: order-valkey-headless.bookstore.svc.cluster.local
      port: 6379
  temporal:
    connection:
      target: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: bookstore

grpc:
  server:
    host: 0.0.0.0
    port: 9090

management:
  otlp:
    metrics:
      export:
        url: http://alloy-gateway.grafana.svc.cluster.local:4318/v1/metrics
        step: 60s
        base-time-unit: seconds
  opentelemetry:
    resource-attributes:
      "[service.name]": order-app
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        temporal: true
        "[rpc.server.duration]": true
  endpoints:
    web:
      exposure:
        include: ""
