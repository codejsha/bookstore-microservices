{{- if and .Values.rollout.enabled .Values.rollout.canary.analysis.enabled }}
{{- $analysis := .Values.rollout.canary.analysis }}
{{- $canary := printf "%s-canary" (include "inventory.fullname" .) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "inventory.fullname" . }}-canary
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: {{ $analysis.interval }}
      {{- if $analysis.count }}
      count: {{ $analysis.count }}
      {{- end }}
      failureLimit: {{ $analysis.failureLimit }}
      successCondition: len(result) == 0 || result[0] >= {{ $analysis.successRateThreshold }}
      provider:
        prometheus:
          address: {{ $analysis.prometheusAddress }}
          query: >-
            sum(rate(istio_requests_total{destination_service_name="{{ $canary }}",destination_service_namespace="{{ .Release.Namespace }}",response_code!~"5.."}[{{ $analysis.window }}]))
            /
            sum(rate(istio_requests_total{destination_service_name="{{ $canary }}",destination_service_namespace="{{ .Release.Namespace }}"}[{{ $analysis.window }}]))
    - name: latency-p99
      interval: {{ $analysis.interval }}
      {{- if $analysis.count }}
      count: {{ $analysis.count }}
      {{- end }}
      failureLimit: {{ $analysis.failureLimit }}
      successCondition: len(result) == 0 || result[0] <= {{ $analysis.latencyP99ThresholdMs }}
      provider:
        prometheus:
          address: {{ $analysis.prometheusAddress }}
          query: >-
            histogram_quantile(0.99,
            sum(rate(istio_request_duration_milliseconds_bucket{destination_service_name="{{ $canary }}",destination_service_namespace="{{ .Release.Namespace }}"}[{{ $analysis.window }}])) by (le))
{{- end }}
