image:
  tag: "1.0.0"

extraEnv:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: SPRING_CONFIG_IMPORT
    value: "configserver:http://config-server.cloud-config.svc.cluster.local:8888,optional:file:/vault/secrets/db.properties"

service:
  grpc:
    enabled: true
    port: 9090

mesh:
  waypoint: "bookstore-waypoint"

gatewayApi:
  enabled: true
  host: "payment-api.example.com"
