replicaCount: 2
revisionHistoryLimit: 3

image:
  repository: harbor.example.com/bookstore/payment
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "payment-mysql"
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: true

env:
  - name: PYROSCOPE_APPLICATION_NAME
    value: payment-app
  - name: PYROSCOPE_SERVER_ADDRESS
    value: "http://alloy-agent.grafana.svc.cluster.local:9095"
  - name: PYROSCOPE_FORMAT
    value: jfr
  - name: PYROSCOPE_PROFILING_ENABLED
    value: "true"
  - name: PYROSCOPE_LABELS
    value: "namespace=bookstore"
  - name: OTEL_SERVICE_NAME
    value: payment-app
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy-gateway.grafana.svc.cluster.local:4318"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRICS_EXPORTER
    value: none
  - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
    value: "false"
  - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
    value: "true"
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_traceidratio
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "0.1"
extraEnv: []

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/role: "bookstore-mysql-role"
  vault.hashicorp.com/agent-inject-secret-db.properties: "database/static-creds/payment-mysql-static"
  vault.hashicorp.com/agent-inject-template-db.properties: |
    {{- with secret "database/static-creds/payment-mysql-static" -}}
    db.username={{ .Data.username }}
    db.password={{ .Data.password }}
    db.name=payment_db
    {{- end -}}
  vault.hashicorp.com/agent-inject-secret-hyperswitch.properties: "kv/data/hyperswitch/payment"
  vault.hashicorp.com/agent-inject-template-hyperswitch.properties: |
    {{- with secret "kv/data/hyperswitch/payment" -}}
    hyperswitch.api-key={{ .Data.data.api_key }}
    hyperswitch.webhook-secret={{ .Data.data.webhook_secret }}
    {{- end -}}
podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  grpc:
    enabled: true
    port: 9090

resources:
  requests:
    cpu: 10m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

mesh:
  waypoint: "bookstore-waypoint"
  requestTimeout: "15s"

gatewayApi:
  enabled: false
  host: "example.com"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
rollout:
  enabled: true
  canary:
    steps:
      - weight: 10
        pause: "60s"
      - weight: 30
        pause: "60s"
      - weight: 60
        pause: "60s"
    analysis:
      enabled: true
      startingStep: 1
      interval: "30s"
      count: 0
      failureLimit: 1
      window: "2m"
      successRateThreshold: "0.99"
      latencyP99ThresholdMs: "1000"
      prometheusAddress: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"
