{{- if .Values.istio.enabled -}}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ include "payment-command.fullname" . }}-dr
  labels:
    {{- include "payment-command.labels" . | nindent 4 }}
  {{- with .Values.istio.destinationRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ include "payment-command.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  {{- with .Values.istio.trafficPolicy }}
  trafficPolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
