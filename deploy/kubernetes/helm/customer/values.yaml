replicaCount: 2
revisionHistoryLimit: 0
terminationGracePeriodSeconds: 60

image:
  repository: harbor.example.com/bookstore/customer
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "customer-postgres"
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/role: "bookstore-postgres-role"
  vault.hashicorp.com/agent-inject-secret-db.properties: "database/static-creds/customer-postgres-static"
  vault.hashicorp.com/agent-inject-template-db.properties: |
    {{- with secret "database/static-creds/customer-postgres-static" -}}
    db.username={{ .Data.username }}
    db.password={{ .Data.password }}
    {{- end -}}
podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  https:
    enabled: false
    port: 8443

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

mesh:
  waypoint: "bookstore-waypoint"
  requestTimeout: "15s"

gatewayApi:
  enabled: false
  host: "example.com"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
  storefront:
    enabled: false
    host: "example.com"
    pathPrefixes:
      - "/api/v1/customers"
      - "/api/v1/books"
      - "/api/v1/tickets"
      - "/api/v1/categories"
      - "/api/v1/faqs"
rollout:
  enabled: true
  canary:
    steps:
      - weight: 10
        pause: "60s"
      - weight: 30
        pause: "60s"
      - weight: 60
        pause: "60s"
    analysis:
      enabled: true
      startingStep: 1
      interval: "30s"
      count: 0
      failureLimit: 1
      window: "2m"
      successRateThreshold: "0.99"
      latencyP99ThresholdMs: "1000"
      prometheusAddress: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"

appConfig:
  server:
    port: 8080
  app:
    logging:
      level: info
  grpc:
    port: 9090
    order_server:
      host: order.bookstore.svc.cluster.local
      port: 9090
    payment_server:
      host: payment.bookstore.svc.cluster.local
      port: 9090
    user_server:
      host: identity.bookstore.svc.cluster.local
      port: 9090
    fulfillment_server:
      host: fulfillment.bookstore.svc.cluster.local
      port: 9090
  kafka:
    broker:
      bootstrap_servers:
        - bookstore-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093
    schema_registry:
      url: http://schemaregistry.kafka.svc.cluster.local:8081
  database:
    datasource:
      driver: postgres
      host: customer-postgres-rw.bookstore.svc.cluster.local
      port: 5432
      db_name: customer_db
      params:
        - sslmode=disable
        - connect_timeout=5
        - statement_timeout=15000
  telemetry:
    collector:
      traceUrl: alloy-gateway.grafana.svc.cluster.local:4317
    profiling:
      serverAddress: http://alloy-agent.grafana.svc.cluster.local:9095
    resource:
      namespace: bookstore
    sampling:
      ratio: 0.1

appConfigProfiles: {}
