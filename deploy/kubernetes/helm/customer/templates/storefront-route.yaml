{{- if .Values.gatewayApi.storefront.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "customer.fullname" . }}-storefront-route
  labels:
    {{- include "customer.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayApi.gatewayName }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      sectionName: https-{{ splitList "." .Values.gatewayApi.storefront.host | first }}
  hostnames:
    - {{ .Values.gatewayApi.storefront.host }}
  rules:
    - matches:
        {{- range .Values.gatewayApi.storefront.pathPrefixes }}
        - path:
            type: PathPrefix
            value: {{ . }}
        {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "customer.fullname" . }}
          port: {{ .Values.service.port }}
          weight: {{ if .Values.rollout.enabled }}100{{ else }}1{{ end }}
        {{- if .Values.rollout.enabled }}
        - group: ""
          kind: Service
          name: {{ include "customer.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- end }}
{{- end }}
