replicaCount: 2
revisionHistoryLimit: 0

image:
  repository: harbor.example.com/bookstore/order
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "order-postgres"
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: true

env:
  - name: PYROSCOPE_APPLICATION_NAME
    value: order-app
  - name: PYROSCOPE_SERVER_ADDRESS
    value: "http://alloy-agent.grafana.svc.cluster.local:9095"
  - name: PYROSCOPE_FORMAT
    value: jfr
  - name: PYROSCOPE_PROFILING_ENABLED
    value: "true"
  - name: PYROSCOPE_LABELS
    value: "namespace=bookstore"
  - name: OTEL_SERVICE_NAME
    value: order-app
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy-gateway.grafana.svc.cluster.local:4318"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRICS_EXPORTER
    value: none
  - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
    value: "false"
  - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
    value: "true"
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_traceidratio
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "0.1"
extraEnv: []

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/role: "bookstore-postgres-role"
  vault.hashicorp.com/agent-inject-secret-db.properties: "database/static-creds/order-postgres-static"
  vault.hashicorp.com/agent-inject-template-db.properties: |
    {{- with secret "database/static-creds/order-postgres-static" -}}
    db.username={{ .Data.username }}
    db.password={{ .Data.password }}
    db.name=order_db
    {{- end -}}
  vault.hashicorp.com/agent-inject-secret-temporal.properties: "kv-bookstore/data/order/temporal"
  vault.hashicorp.com/agent-inject-template-temporal.properties: |
    {{- with secret "kv-bookstore/data/order/temporal" -}}
    temporal.auth.client-id={{ .Data.data.client_id }}
    temporal.auth.client-secret={{ .Data.data.client_secret }}
    {{- end -}}
podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  grpc:
    enabled: true
    port: 9090

resources:
  requests:
    cpu: 10m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

mesh:
  waypoint: "bookstore-waypoint"
  requestTimeout: "15s"

gatewayApi:
  enabled: false
  host: "example.com"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
  storefront:
    enabled: false
    host: "example.com"
    pathPrefixes:
      - "/api/v1/cart"
      - "/api/v1/orders"
rollout:
  enabled: true
  canary:
    steps:
      - weight: 10
        pause: "60s"
      - weight: 30
        pause: "60s"
      - weight: 60
        pause: "60s"
    analysis:
      enabled: true
      startingStep: 1
      interval: "30s"
      count: 0
      failureLimit: 1
      window: "2m"
      successRateThreshold: "0.99"
      latencyP99ThresholdMs: "1000"
      prometheusAddress: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"

appConfig:
  server:
    port: 8080
  spring:
    threads:
      virtual:
        enabled: true
    flyway:
      enabled: false
    datasource:
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource
      url: jdbc:postgresql://order-postgres-rw.bookstore.svc.cluster.local:5432/order_db?sslmode=disable
      username: ${db.username}
      password: ${db.password}
      hikari:
        minimum-idle: 30
        maximum-pool-size: 30
        connection-timeout: 10000
        validation-timeout: 5000
        leak-detection-threshold: 60000
        auto-commit: true
        max-lifetime: 1800000
    data:
      redis:
        host: order-valkey-headless.bookstore.svc.cluster.local
        port: 6379
    temporal:
      connection:
        target: temporal-frontend.temporal.svc.cluster.local:7233
      namespace: bookstore
  temporal:
    worker:
      max-concurrent-activity-executions: 16
      max-concurrent-workflow-task-executions: 32
      activity-task-pollers: 2
      workflow-task-pollers: 2
    auth:
      enabled: true
      token-url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bookstore/protocol/openid-connect/token
  grpc:
    server:
      host: 0.0.0.0
      port: 9090
  management:
    otlp:
      metrics:
        export:
          url: http://alloy-gateway.grafana.svc.cluster.local:4318/v1/metrics
          step: 60s
          base-time-unit: seconds
    opentelemetry:
      resource-attributes:
        '[service.name]': order-app
    metrics:
      distribution:
        percentiles-histogram:
          '[http.server.requests]': true
          temporal: true
          '[rpc.server.duration]': true
    endpoints:
      web:
        exposure:
          include: ""

appConfigProfiles: {}
