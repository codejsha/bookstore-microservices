{{- if .Values.rollout.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "order.fullname" . }}-canary
  labels:
    {{- include "order.labels" . | nindent 4 }}
    {{- if .Values.mesh }}
    {{- if .Values.mesh.waypoint }}
    istio.io/use-waypoint: {{ .Values.mesh.waypoint }}
    istio.io/ingress-use-waypoint: "true"
    {{- end }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      appProtocol: {{ .Values.service.appProtocol | default "http" }}
    {{- if .Values.service.grpc.enabled }}
    - port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      appProtocol: grpc
    {{- end }}
  selector:
    {{- include "order.selectorLabels" . | nindent 4 }}
{{- end }}
