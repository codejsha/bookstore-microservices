apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fulfillment.fullname" . }}-config
  labels:
    {{- include "fulfillment.labels" . | nindent 4 }}
data:
  application.yaml: |
    {{- toYaml .Values.appConfig | nindent 4 }}
  {{- range $name, $config := .Values.appConfigProfiles }}
  application-{{ $name }}.yaml: |
    {{- toYaml $config | nindent 4 }}
  {{- end }}
