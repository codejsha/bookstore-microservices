replicaCount: 2
revisionHistoryLimit: 0
terminationGracePeriodSeconds: 60

image:
  repository: harbor.example.com/bookstore/fulfillment
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "fulfillment-postgres"
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: true

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/agent-init-first: "true"
  vault.hashicorp.com/role: "bookstore-postgres-role"
  vault.hashicorp.com/agent-inject-secret-db.env: "database/static-creds/fulfillment-postgres-static"
  vault.hashicorp.com/agent-inject-template-db.env: |
    {{- with secret "database/static-creds/fulfillment-postgres-static" -}}
    FULFILLMENT__DATABASE__USERNAME={{ .Data.username }}
    FULFILLMENT__DATABASE__PASSWORD={{ .Data.password }}
    {{- end -}}
  vault.hashicorp.com/agent-inject-secret-temporal.env: "kv-bookstore/data/fulfillment/temporal"
  vault.hashicorp.com/agent-inject-template-temporal.env: |
    {{- with secret "kv-bookstore/data/fulfillment/temporal" -}}
    FULFILLMENT__TEMPORAL__AUTH__CLIENT_ID={{ .Data.data.client_id }}
    FULFILLMENT__TEMPORAL__AUTH__CLIENT_SECRET={{ .Data.data.client_secret }}
    {{- end -}}
podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  grpc:
    enabled: true
    port: 9090

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 768Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

mesh:
  waypoint: "bookstore-waypoint"
  requestTimeout: "15s"

gatewayApi:
  enabled: false
  host: "example.com"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
rollout:
  enabled: true
  canary:
    steps:
      - weight: 10
        pause: "60s"
      - weight: 30
        pause: "60s"
      - weight: 60
        pause: "60s"
    analysis:
      enabled: true
      startingStep: 1
      interval: "30s"
      count: 0
      failureLimit: 1
      window: "2m"
      successRateThreshold: "0.99"
      latencyP99ThresholdMs: "1000"
      prometheusAddress: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"

appConfig:
  server:
    port: 8080
  app:
    logging_level: info
  telemetry:
    service_name: fulfillment-app
    enabled: true
    endpoint: alloy-gateway.grafana.svc.cluster.local:4317
    profiling_endpoint: http://alloy-agent.grafana.svc.cluster.local:9095
    sampling_ratio: 0.1
  database:
    host: fulfillment-postgres-rw.bookstore.svc.cluster.local
    port: 5432
    db_name: fulfillment_db
  temporal:
    enabled: true
    host: temporal-frontend.temporal.svc.cluster.local:7233
    namespace: bookstore
    task_queue: fulfillment-task-queue
    auth:
      enabled: true
      token_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bookstore/protocol/openid-connect/token

appConfigProfiles: {}
