replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: harbor.example.com/bookstore/admin
  tag: 1.0.0
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "admin"
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: false

env:
  - name: PYROSCOPE_APPLICATION_NAME
    value: admin-app
  - name: PYROSCOPE_SERVER_ADDRESS
    value: "http://alloy-agent.grafana.svc.cluster.local:9095"
  - name: PYROSCOPE_FORMAT
    value: jfr
  - name: PYROSCOPE_PROFILING_ENABLED
    value: "true"
  - name: PYROSCOPE_LABELS
    value: "namespace=bookstore"
  - name: OTEL_SERVICE_NAME
    value: admin-app
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://alloy-gateway.grafana.svc.cluster.local:4318"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_TRACES_EXPORTER
    value: otlp
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRICS_EXPORTER
    value: none
  - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
    value: "false"
  - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
    value: "true"
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_traceidratio
  - name: OTEL_TRACES_SAMPLER_ARG
    value: "1.0"
extraEnv: []

podAnnotations: {}

podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  https:
    enabled: false
    port: 8443

resources:
  requests:
    cpu: 10m
    memory: 320Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

mesh:
  waypoint: "bookstore-waypoint"

gatewayApi:
  enabled: false
  host: "example.com"
  pathPrefix: "/api/v1/admin"
  stripRequestHeaders:
    - "cookie"
  gatewayName: "bookstore-gateway"
  gatewayNamespace: "istio-system"
  directApi:
    enabled: false
    host: "example.com"
    pathPrefix: "/"
    stripRequestHeaders:
      - "cookie"
