replicaCount: 1

image:
  repository: harbor.example.com/bookstore/order
  tag: 0.1.0
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

automountServiceAccountToken: true

podAnnotations:
  sidecar.istio.io/rewriteAppHTTPProbers: "false"
podLabels:
  app.kubernetes.io/group: bookstore

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  https:
    enabled: false
    port: 8443

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi


livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 45
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

istio:
  enabled: false
  host: "example.com"
  tls:
    enabled: false
    httpsRedirect: false
    mode: "SIMPLE"
    credentialName: ""
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
  gateway:
    annotations: {}
  virtualService:
    annotations: {}
  destinationRule:
    annotations: {}

### mysql subchart configuration
mysql:
  architecture: standalone

  auth:
    createDatabase: true
    database: order_db
    usePasswordFiles: true
    customPasswordFiles:
      root: /vault/secrets/mysql-root

  primary:
    name: primary
    automountServiceAccountToken: true
    podAnnotations:
      traffic.sidecar.istio.io/excludeOutboundPorts: "8200"
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-inject-status: "update"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/log-level: "debug"
      vault.hashicorp.com/log-format: "json"
      vault.hashicorp.com/service: "http://vault.vault.svc.cluster.local:8200"
      vault.hashicorp.com/role: "bookstore-mysql-role"
      vault.hashicorp.com/agent-inject-secret-mysql-root-pw: "kv/data/bookstore/order-command/mysql"
      vault.hashicorp.com/secret-volume-path-mysql-root-pw: "/vault/secrets"
      vault.hashicorp.com/agent-inject-file-mysql-root-pw: "mysql-root"
      vault.hashicorp.com/agent-inject-template-mysql-root-pw: |
        {{`{{- with secret "kv/data/bookstore/order-command/mysql" -}}`}}
        {{`{{ .Data.data.root_password }}`}}
        {{`{{- end -}}`}}
      vault.hashicorp.com/agent-inject-secret-mysql-user: "kv/data/bookstore/order-command/mysql"
      vault.hashicorp.com/secret-volume-path-mysql-user: "/vault/secrets"
      vault.hashicorp.com/agent-inject-file-mysql-user: "env-mysql"
      vault.hashicorp.com/agent-inject-template-mysql-user: |
        {{`{{- with secret "kv/data/bookstore/order-command/mysql" -}}`}}
        {{`export MYSQL_USER="{{ .Data.data.username }}"`}}
        {{`export MYSQL_PASSWORD="{{ .Data.data.password }}"`}}
        {{`{{- end -}}`}}
    extraEnvVars:
      - name: BASH_ENV
        value: "/vault/secrets/env-mysql"
    persistence:
      enabled: true

  # secondary:
  #   name: secondary
  #   replicaCount: 1
  #   automountServiceAccountToken: true
  #   podAnnotations: {}
  #   persistence:
  #     enabled: true

  serviceAccount:
    create: false
    name: "order-command-mysql"
    annotations: {}

  networkPolicy:
    enabled: false

  metrics:
    enabled: false
