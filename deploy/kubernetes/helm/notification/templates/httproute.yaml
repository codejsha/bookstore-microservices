{{- if .Values.gatewayApi.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "notification.fullname" . }}-route
  labels:
    {{- include "notification.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayApi.gatewayName }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      sectionName: https-{{ splitList "." .Values.gatewayApi.host | first }}
  hostnames:
    - {{ .Values.gatewayApi.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "notification.fullname" . }}
          port: {{ .Values.service.port }}
          weight: {{ if .Values.rollout.enabled }}100{{ else }}1{{ end }}
        {{- if .Values.rollout.enabled }}
        - group: ""
          kind: Service
          name: {{ include "notification.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- end }}
{{- end }}
