{{- if .Values.rollout.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "delivery.fullname" . }}-mesh
  labels:
    {{- include "delivery.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: {{ include "delivery.fullname" . }}
      port: {{ .Values.service.port }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "delivery.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 100
        - group: ""
          kind: Service
          name: {{ include "delivery.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
      timeouts:
        request: {{ .Values.mesh.requestTimeout }}
{{- end }}
