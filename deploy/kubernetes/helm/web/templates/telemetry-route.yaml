{{- if .Values.gatewayApi.telemetry.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web.fullname" . }}-telemetry-route
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gatewayApi.gatewayName }}
      namespace: {{ .Values.gatewayApi.gatewayNamespace }}
      sectionName: https-{{ splitList "." .Values.gatewayApi.host | first }}
  hostnames:
    - {{ .Values.gatewayApi.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /faro/collect
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /collect
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.gatewayApi.telemetry.alloyService }}
          namespace: {{ .Values.gatewayApi.telemetry.alloyNamespace }}
          port: {{ .Values.gatewayApi.telemetry.faroPort }}
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /otlp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.gatewayApi.telemetry.alloyService }}
          namespace: {{ .Values.gatewayApi.telemetry.alloyNamespace }}
          port: {{ .Values.gatewayApi.telemetry.otlpPort }}
          weight: 1
{{- end }}
