version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: user/v1.proto
      value: pb/userpb
    - file_option: go_package
      path: common/v1.proto
      value: pb/commonpb
    - file_option: java_package
      path: user/v1.proto
      value: com.codejsha.bookstore.generated.application.port.pb.userpb
    - file_option: java_package
      path: common/v1.proto
      value: com.codejsha.bookstore.generated.application.port.pb.commonpb
    - file_option: java_multiple_files
      value: true
inputs:
  - directory: ./modules
    paths:
      - modules/user/v1.proto
plugins:
  ### customer (client)
  - local: protoc-gen-go
    out: ../../../services/customer/generated/application/port
    opt: paths=import
  - local: protoc-gen-go-grpc
    out: ../../../services/customer/generated/application/port
    opt: paths=import
  ### identity (server)
  - local: protoc-gen-go
    out: ../../../services/identity/generated/application/port
    opt: paths=import
  - local: protoc-gen-go-grpc
    out: ../../../services/identity/generated/application/port
    opt: paths=import
