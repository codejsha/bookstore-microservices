[general]
gen_lang = "kotlin"
gen_type = "server"
input_spec = "api/openapi/schema/openapi.1.0.0.json"
output_dir = "src/main/generated"

[packages]
api_package = "com.codejsha.bookstore.generated.application.port.openapi.api"
model_package = "com.codejsha.bookstore.generated.application.port.openapi.model"
constant_package = "com.codejsha.bookstore.generated.application.port.openapi.model"

[options]
validation_enabled = true
kotlin_security_enabled = true
kotlin_pagination_enabled = true
