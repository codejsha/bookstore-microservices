[project]
name = "support-contract-test"
version = "1.0.0"
description = "Schemathesis contract tests for the support service"
requires-python = ">=3.13"
dependencies = [
    "schemathesis>=3.39,<4",
    "pytest>=8.3",
    "hypothesis>=6.122",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
