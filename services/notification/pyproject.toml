[project]
name = "notification"
version = "1.0.0"
description = "Notification service for bookstore microservices"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "cryptography>=44.0",
    "alembic>=1.15",
    "grpcio>=1.71",
    "grpcio-tools>=1.71",
    "temporalio>=1.8",
    "opentelemetry-api>=1.33",
    "opentelemetry-sdk>=1.33",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.54b0",
    "opentelemetry-exporter-otlp>=1.33",
    "pyroscope-io>=0.8.0",
    "structlog>=25.1",
    "opentelemetry-instrumentation-system-metrics>=0.54b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["internal*", "generated*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
