version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: payment/v1.proto
      value: pb/paymentpb
    - file_option: java_package
      path: payment/v1.proto
      value: com.codejsha.bookstore.generated.application.port.pb.paymentpb
    - file_option: java_multiple_files
      value: true
inputs:
  - directory: ./proto
    paths:
      - proto/modules/payment/v1.proto
plugins:
  - protoc_builtin: java
    out: ../../src/main/generated
  - local: protoc-gen-grpc-java
    out: ../../src/main/generated
