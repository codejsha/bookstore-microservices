<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore Admin</title>
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
        html:not(.ready) body { visibility: hidden; }
    </style>
    <script>
        document.fonts.load('16px "Geist Variable"')
                    .then(() => document.documentElement.classList.add('ready'))
                    .catch(() => document.documentElement.classList.add('ready'));
                setTimeout(() => document.documentElement.classList.add('ready'), 500);
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
